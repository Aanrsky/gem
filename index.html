<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangkap Koin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>🪙 Tangkap Koin</h1>

        <div class="info">
            <span>Skor: <b id="score">0</b></span>
            <span>Waktu: <b id="time">30</b></span>
        </div>

        <div id="gameArea">
            <div id="player">🧙</div>
            <div id="coin">🪙</div>
        </div>

        <button id="startButton">Mulai Game</button>

        <p class="control">
            🎮 Gunakan <b>W A S D</b> atau <b>tombol panah</b> untuk bergerak
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
